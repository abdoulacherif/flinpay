<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flinpay — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:#0D0D0D;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden
}
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(26,60,255,0.2) 0%,transparent 70%);
  pointer-events:none
}
.box{
  background:#141420;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:52px 44px;
  width:100%;max-width:400px;
  position:relative;z-index:1;
  box-shadow:0 32px 64px rgba(0,0,0,0.4)
}
.logo{
  font-family:'Space Grotesk',sans-serif;
  font-weight:800;font-size:2rem;
  color:white;text-align:center;margin-bottom:6px
}
.logo span{color:#1A3CFF}
.subtitle{
  text-align:center;color:rgba(255,255,255,0.3);
  font-size:0.82rem;margin-bottom:40px;
  letter-spacing:0.05em;text-transform:uppercase
}
.field{margin-bottom:16px}
label{
  display:block;font-size:0.75rem;font-weight:600;
  color:rgba(255,255,255,0.35);letter-spacing:0.1em;
  text-transform:uppercase;margin-bottom:8px
}
input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:10px;color:white;
  font-size:0.92rem;font-family:'Inter',sans-serif;
  outline:none;transition:border-color .2s
}
input:focus{border-color:#1A3CFF}
input::placeholder{color:rgba(255,255,255,0.2)}
.code-input{letter-spacing:.5em;text-align:center;font-family:'JetBrains Mono',monospace;font-size:1.15rem}
.forgot-row{display:flex;justify-content:flex-end;margin:-6px 0 16px}
.forgot-row a{font-size:.78rem;color:rgba(255,255,255,0.4);text-decoration:none}
.forgot-row a:hover{color:white}
.btn-login{
  width:100%;padding:14px;
  background:#1A3CFF;color:white;
  border:none;border-radius:10px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:0.95rem;
  cursor:pointer;margin-top:8px;
  transition:all .2s;letter-spacing:0.02em
}
.btn-login:hover{background:#1430e0;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-back-step{
  width:100%;padding:12px;
  background:transparent;color:rgba(255,255,255,0.5);
  border:1.5px solid rgba(255,255,255,0.12);border-radius:10px;
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.85rem;
  cursor:pointer;margin-top:10px
}
.btn-back-step:hover{color:white;border-color:rgba(255,255,255,0.25)}
.error{
  background:rgba(255,68,68,0.1);
  border:1px solid rgba(255,68,68,0.3);
  color:#ff7070;border-radius:8px;
  padding:10px 14px;font-size:0.83rem;
  margin-top:14px;display:none;text-align:center
}
.back{
  text-align:center;margin-top:24px;
  font-size:0.82rem;color:rgba(255,255,255,0.2)
}
.back a{color:rgba(255,255,255,0.4);text-decoration:none}
.back a:hover{color:white}
.signup-link{
  text-align:center;margin-top:16px;
  font-size:0.85rem;color:rgba(255,255,255,0.3)
}
.signup-link a{color:#1A3CFF;text-decoration:none;font-weight:600}
.signup-link a:hover{text-decoration:underline}
.loading{opacity:0.6;pointer-events:none}
.step2-desc{color:rgba(255,255,255,0.4);font-size:.83rem;line-height:1.6;margin-bottom:18px;text-align:center}
#step2{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Flin<span>pay</span></div>
  <div class="subtitle" id="subtitle">Connexion à votre compte</div>

  <div id="step1">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="vous@entreprise.com" autocomplete="email"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="forgot-row"><a href="/forgot-password">Mot de passe oublié ?</a></div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">
      Se connecter →
    </button>
    <div class="signup-link">
      Pas encore de compte ? <a href="/register">Créer un compte</a>
    </div>
  </div>

  <div id="step2">
    <div class="step2-desc">Entrez le code à 6 chiffres généré par votre application d'authentification (Google Authenticator ou équivalent).</div>
    <div class="field">
      <label>Code de vérification</label>
      <input type="text" id="twofa-code" class="code-input" maxlength="6" inputmode="numeric" placeholder="000000"
        onkeydown="if(event.key==='Enter') doVerify2fa()">
    </div>
    <button class="btn-login" id="btn-verify" onclick="doVerify2fa()">
      Vérifier →
    </button>
    <button class="btn-back-step" onclick="backToStep1()">← Retour</button>
  </div>

  <div class="error" id="error-msg"></div>
  <div class="back"><a href="/">← Retour au site</a></div>
</div>

<script>
let pendingToken=null;

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-msg');

  if (!email || !password) {
    showError('Veuillez remplir tous les champs');
    return;
  }

  btn.textContent = 'Connexion...';
  btn.classList.add('loading');
  err.style.display = 'none';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (data.ok && data.requires_2fa) {
      pendingToken = data.pending_token;
      goToStep2();
    } else if (data.ok) {
      window.location.href = '/dashboard';
    } else {
      showError(data.error || 'Identifiants incorrects');
    }
  } catch(e) {
    showError('Erreur de connexion. Réessayez.');
  }

  btn.textContent = 'Se connecter →';
  btn.classList.remove('loading');
}

function goToStep2(){
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('subtitle').textContent='Vérification en deux étapes';
  document.getElementById('error-msg').style.display='none';
  document.getElementById('twofa-code').value='';
  document.getElementById('twofa-code').focus();
}
function backToStep1(){
  pendingToken=null;
  document.getElementById('step1').style.display='block';
  document.getElementById('step2').style.display='none';
  document.getElementById('subtitle').textContent='Connexion à votre compte';
  document.getElementById('error-msg').style.display='none';
  document.getElementById('password').value='';
}

async function doVerify2fa(){
  const code=document.getElementById('twofa-code').value.trim();
  const btn=document.getElementById('btn-verify');
  if(!/^\d{6}$/.test(code)){
    showError('Entrez un code à 6 chiffres');
    return;
  }
  if(!pendingToken){
    showError('Session expirée, reconnectez-vous');
    backToStep1();
    return;
  }

  btn.textContent='Vérification...';
  btn.classList.add('loading');
  document.getElementById('error-msg').style.display='none';

  try{
    const r=await fetch('/api/login/2fa',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pending_token:pendingToken, code})
    });
    const data=await r.json();
    if(data.ok){
      window.location.href='/dashboard';
    }else{
      showError(data.error||'Code invalide');
    }
  }catch(e){
    showError('Erreur de connexion. Réessayez.');
  }

  btn.textContent='Vérifier →';
  btn.classList.remove('loading');
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
