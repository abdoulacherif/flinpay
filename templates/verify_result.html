<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flinpay — Vérification email</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;background:#0D0D0D;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:40px 20px;
  position:relative;overflow:hidden
}
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(26,60,255,0.18) 0%,transparent 70%);
  pointer-events:none
}
.box{
  background:#141420;border:1px solid rgba(255,255,255,0.08);border-radius:24px;
  padding:44px 36px;width:100%;max-width:420px;position:relative;z-index:1;
  box-shadow:0 32px 64px rgba(0,0,0,0.4);text-align:center
}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.5rem;color:white;margin-bottom:20px}
.logo span{color:#1A3CFF}
.icon-big{font-size:2.8rem;margin-bottom:14px}
.title{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.25rem;color:white;margin-bottom:10px}
.text{color:rgba(255,255,255,0.5);font-size:.9rem;line-height:1.6;margin-bottom:26px}
.btn{
  display:inline-block;padding:13px 28px;background:#1A3CFF;color:white;text-decoration:none;
  border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.9rem
}
.btn:hover{background:#1430e0}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Flin<span>pay</span></div>
  {% if success %}
    <div class="icon-big">✅</div>
    <div class="title">Email confirmé</div>
    <div class="text">{{ message }}</div>
    <a class="btn" href="/login">Se connecter</a>
  {% else %}
    <div class="icon-big">⚠️</div>
    <div class="title">Vérification impossible</div>
    <div class="text">{{ message }}</div>
    <a class="btn" href="/login">Retour à la connexion</a>
  {% endif %}
</div>
</body>
</html>
