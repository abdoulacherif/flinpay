<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flinpay — Vérification email</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style nonce="{{ csp_nonce }}">
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0A6CFF;--blue-deep:#0052CC;--cyan:#00C4FF;
  --green:#00C48C;--danger:#FF4D4D;--ink:#0B0D17;
  --gradient:linear-gradient(135deg,#00C4FF 0%,#0A6CFF 55%,#003399 100%);
  --gradient-soft:linear-gradient(135deg,#00C4FF 0%,#0A6CFF 100%);
}
body{
  font-family:'Inter',sans-serif;background:var(--gradient);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:40px 20px;
  position:relative;overflow:hidden;
}
body::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
body::after{content:'';position:absolute;bottom:-150px;left:-100px;width:350px;height:350px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}

.box{
  background:white;border-radius:24px;
  padding:44px 36px;width:100%;max-width:420px;position:relative;z-index:1;
  box-shadow:0 30px 60px rgba(0,30,100,0.3);text-align:center;
}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.5rem;color:var(--ink);margin-bottom:20px}
.logo span{color:var(--blue)}
.icon-big{font-size:3rem;margin-bottom:14px}
.title{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.25rem;color:var(--ink);margin-bottom:10px}
.text{color:#767A94;font-size:.9rem;line-height:1.6;margin-bottom:26px}
.btn{
  display:inline-block;padding:13px 28px;
  background:var(--gradient-soft);color:white;text-decoration:none;
  border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.9rem;
  box-shadow:0 6px 18px rgba(10,108,255,.35);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(10,108,255,.45)}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Flin<span>pay</span></div>
  {% if success %}
    <div class="icon-big">✅</div>
    <div class="title">Email confirmé</div>
    <div class="text">{{ message }}</div>
    <a class="btn" href="/login">Se connecter</a>
  {% else %}
    <div class="icon-big">⚠️</div>
    <div class="title">Vérification impossible</div>
    <div class="text">{{ message }}</div>
    <a class="btn" href="/login">Retour à la connexion</a>
  {% endif %}
</div>
</body>
</html>
