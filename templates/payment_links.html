<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flinpay — Liens de paiement</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--ink:#0B0D17;--ink-soft:#141625;
--bg:#F5F6FB;--surface:#FFFFFF;
--border:#E7E9F3;--border-soft:#F0F1F8;
--blue:#1A3CFF;--blue-deep:#0F2ADB;--blue-tint:#EEF1FF;
--gold:#FFB400;--gold-tint:#FFF6E0;
--green:#00C48C;--green-tint:#E3FBF3;
--danger:#FF4D4D;--danger-tint:#FFEAEA;
--text:#12131C;--muted:#767A94;--muted-soft:#A6AABF;
--r-lg:18px;--r-md:14px;--r-sm:9px;
--shadow-sm:0 1px 2px rgba(15,17,32,.04);
--shadow-md:0 1px 2px rgba(15,17,32,.04),0 10px 28px -14px rgba(15,17,32,.18);
--sidebar-w:270px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
a{color:inherit}
.icon{width:18px;height:18px;flex-shrink:0}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── structure : sidebar + contenu (parité avec dashboard.html) ── */
.shell{display:flex;min-height:100vh}
.overlay{display:none;position:fixed;inset:0;background:rgba(8,9,16,0.55);z-index:250;backdrop-filter:blur(2px)}
.overlay.show{display:block}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:320px;background:var(--ink);z-index:300;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sidebar-top{padding:22px 20px 16px;display:flex;align-items:center;justify-content:space-between;position:relative;flex-shrink:0}
.sidebar-top::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:linear-gradient(90deg,var(--blue) 0%,rgba(255,180,0,.5) 45%,transparent 100%)}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.3rem;color:white;text-decoration:none;letter-spacing:-.01em}
.logo-text span{color:#5B7CFF}
.plan-badge-pill{background:rgba(26,60,255,0.22);color:#8EA6FF;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:5px;margin-top:6px;display:inline-block}
.close-sidebar{background:none;border:none;color:rgba(255,255,255,0.45);font-size:1.2rem;cursor:pointer;padding:4px}

.corridor{margin:14px 20px 4px;padding:11px 12px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:11px;flex-shrink:0}
.corridor-label{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:8px;display:flex;justify-content:space-between}
.corridor-label b{color:#8EA6FF;font-weight:700}
.corridor-flags{display:flex;flex-wrap:wrap;gap:5px;font-size:.9rem;line-height:1}

.sidebar-nav{flex:1;padding:8px 0}
.nav-group{font-size:.6rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,0.22);padding:14px 20px 6px}
.nav-link{display:flex;align-items:center;gap:12px;padding:9px 20px;color:rgba(255,255,255,0.5);font-size:.84rem;font-weight:500;cursor:pointer;transition:all .15s;border-left:3px solid transparent;text-decoration:none;background:none;width:100%;text-align:left}
.nav-link .icon{color:rgba(255,255,255,0.35);transition:color .15s}
.nav-link:hover{color:white;background:rgba(255,255,255,0.045)}
.nav-link:hover .icon{color:rgba(255,255,255,0.7)}
.nav-link.active{color:white;background:rgba(26,60,255,0.16);border-left-color:var(--blue)}
.nav-link.active .icon{color:#8EA6FF}

.sidebar-user{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.06);margin-top:4px;flex-shrink:0}
.user-row{display:flex;align-items:center;gap:10px}
.user-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#5B2CFF);color:white;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:.86rem;flex-shrink:0}
.user-name{font-size:.82rem;font-weight:600;color:white}
.user-email{font-size:.68rem;color:rgba(255,255,255,0.32);margin-top:1px;word-break:break-all}
.logout-link{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,0.32);font-size:.76rem;padding:11px 20px 15px;text-decoration:none;transition:color .15s}
.logout-link:hover{color:#ff7d7d}

.main{flex:1;min-width:0}

.topbar{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.burger-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.burger-btn:hover{background:var(--bg)}
.burger-line{width:20px;height:2px;background:var(--text);border-radius:2px;display:block}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:1.02rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.page{padding:20px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-soft)}
.search-input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:.85rem;background:var(--surface);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--blue)}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:9px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-chip.active{border-color:var(--blue);background:var(--blue-tint);color:var(--blue)}

.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:18px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-title{font-size:.88rem;font-weight:700;letter-spacing:-.01em}
.card-body{padding:16px}

.btn{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.83rem;padding:9px 17px;border-radius:var(--r-sm);border:none;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary{background:var(--blue);color:white}
.btn-primary:hover{background:var(--blue-deep)}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover{background:#e03e3e}
.btn-outline{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn-outline:hover{background:var(--blue-tint)}
.btn-sm{padding:7px 11px;font-size:.76rem}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center}
.btn-toggle-on{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn-toggle-on:hover{background:var(--green-tint)}
.btn-toggle-off{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-toggle-off:hover{background:var(--border-soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}

.form-input{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:.87rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;width:100%;background:var(--surface)}
.form-input:focus{border-color:var(--blue)}
.form-label{font-size:.71rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:block}
.form-group{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-hint{font-size:.72rem;color:var(--muted);margin-top:5px}

.link-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;margin-bottom:10px;transition:all .2s;opacity:0;transform:translateY(6px);animation:cardIn .35s ease forwards}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.link-card:hover{box-shadow:var(--shadow-md);border-color:var(--blue)}
.link-card.is-inactive{opacity:.6}
.link-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.link-name{font-weight:700;font-size:.94rem;margin-bottom:4px;word-break:break-word}
.link-amount{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.15rem;color:var(--blue)}
.link-url{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted);margin-top:8px;word-break:break-all}
.link-stats{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap}
.link-stat{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.link-stat strong{color:var(--text);font-weight:700}
.link-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap}
.b-active{background:var(--green-tint);color:#0A7A50}
.b-inactive{background:var(--border-soft);color:var(--muted)}
.b-type{background:var(--blue-tint);color:var(--blue)}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(8,9,16,0.55);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:26px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 60px rgba(10,12,25,0.25);opacity:0;transform:translateY(14px) scale(.98);transition:all .25s cubic-bezier(.16,.8,.3,1)}
.modal-bg.show .modal{opacity:1;transform:translateY(0) scale(1)}
.modal h3{font-size:1.05rem;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:9px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.preview-box{background:var(--ink);border-radius:16px;padding:26px;text-align:center;margin-top:18px}
.preview-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.25rem;color:white;margin-bottom:14px}
.preview-logo span{color:#5B7CFF}
.preview-amount{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:2.2rem;color:white;letter-spacing:-.02em}
.preview-desc{color:rgba(255,255,255,0.5);font-size:.84rem;margin-top:6px}
.preview-btn{background:var(--blue);color:white;border:none;border-radius:10px;padding:13px 32px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.92rem;margin-top:18px;cursor:pointer;width:100%}
.amount-type-toggle{display:flex;gap:8px;margin-bottom:14px}
.amount-type-btn{flex:1;padding:9px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);text-align:center;transition:all .15s}
.amount-type-btn.active{border-color:var(--blue);background:var(--blue-tint);color:var(--blue)}

.img-drop{border:1.5px dashed var(--border);border-radius:var(--r-md);padding:16px;text-align:center;cursor:pointer;background:var(--bg);font-size:.82rem;color:var(--muted);transition:all .15s;display:block}
.img-drop:hover, .img-drop.drag-over{border-color:var(--blue);background:var(--blue-tint);color:var(--blue)}
.img-drop input{display:none}
.img-preview-wrap{position:relative;display:none;margin-top:10px}
.img-preview{max-width:100%;max-height:120px;border-radius:10px;display:block}
.img-remove{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:white;border:2px solid var(--surface);cursor:pointer;font-size:.8rem;line-height:1;display:flex;align-items:center;justify-content:center}

.status-toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px}
.status-toggle-label{font-size:.83rem;font-weight:600}
.status-toggle-sub{font-size:.72rem;color:var(--muted);margin-top:2px}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background-color:var(--border);transition:.2s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;transition:.2s;border-radius:50%}
input:checked + .slider{background-color:var(--green)}
input:checked + .slider:before{transform:translateX(18px)}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:2.2rem;margin-bottom:10px;opacity:.7}
.empty-text{font-size:.85rem;line-height:1.65}

.skeleton{background:linear-gradient(90deg,var(--border-soft) 25%,var(--bg) 50%,var(--border-soft) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r-md);height:96px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:white;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:500;box-shadow:0 12px 28px rgba(10,12,25,0.28);opacity:0;transition:all .3s;z-index:9999;border-left:4px solid var(--green);max-width:90%}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(min-width:960px){
.overlay{display:none !important}
.sidebar{position:sticky;top:0;height:100vh;width:var(--sidebar-w);max-width:var(--sidebar-w);transform:none;flex-shrink:0}
.close-sidebar{display:none}
.burger-btn{display:none}
.page{max-width:1100px;margin:0 auto;padding:26px 32px 60px}
.topbar{padding:0 32px}
}
@media(max-width:520px){
.form-grid{grid-template-columns:1fr}
.link-top{flex-direction:column}
.link-actions{width:100%;justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){
*{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="sidebar-top">
<div>

</div>
