<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flinpay — Nouveau mot de passe</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style nonce="{{ csp_nonce }}">
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;background:linear-gradient(135deg,#00C4FF 0%,#0A6CFF 55%,#003399 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  position:relative;overflow:hidden;
}
body::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
body::after{content:'';position:absolute;bottom:-150px;left:-100px;width:350px;height:350px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.box{
  background:white;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;
  position:relative;z-index:1;box-shadow:0 30px 60px rgba(0,30,100,0.3);
}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:2rem;color:#0B0D17;text-align:center;margin-bottom:6px}
.logo span{color:#0A6CFF}
.subtitle{text-align:center;color:#767A94;font-size:.82rem;margin-bottom:28px;letter-spacing:.05em;text-transform:uppercase}
.field{margin-bottom:16px}
label{display:block;font-size:0.72rem;font-weight:600;color:#767A94;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px}
input{
  width:100%;padding:13px 16px;background:#F5F6FB;border:1.5px solid #E7E9F3;
  border-radius:10px;color:#12131C;font-size:0.92rem;font-family:'Inter',sans-serif;
  outline:none;transition:border-color .2s,background .2s;
}
input:focus{border-color:#0A6CFF;background:white}
input::placeholder{color:#A6AABF}
.btn{
  width:100%;padding:14px;background:linear-gradient(135deg,#00C4FF 0%,#0A6CFF 100%);
  color:white;border:none;border-radius:10px;font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:0.95rem;cursor:pointer;margin-top:8px;transition:all .2s;
  box-shadow:0 6px 16px rgba(10,108,255,0.3);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,108,255,0.4)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error{
  background:#FFEAEA;border:1px solid rgba(255,77,77,0.3);
  color:#B3271A;border-radius:8px;padding:10px 14px;font-size:0.83rem;
  margin-top:14px;display:none;text-align:center;
}
.success{
  background:#E3FBF3;border:1px solid rgba(0,196,140,0.3);
  color:#0A7A50;border-radius:8px;padding:12px 14px;font-size:0.85rem;
  margin-top:14px;display:none;text-align:center;line-height:1.5;
}
.hint{font-size:.72rem;color:#767A94;margin-top:6px;line-height:1.5}
.back{text-align:center;margin-top:24px;font-size:0.82rem;color:#A6AABF}
.back a{color:#767A94;text-decoration:none}
.back a:hover{color:#12131C}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Flin<span>pay</span></div>
  <div class="subtitle">Nouveau mot de passe</div>

  <form id="reset-form">
    <div class="field">
      <label for="new_password">Nouveau mot de passe</label>
      <input type="password" id="new_password" placeholder="Min. 8 caractères" minlength="8" autocomplete="new-password" required>
      <div class="hint">Minimum 8 caractères.</div>
    </div>
    <div class="field">
      <label for="confirm_password">Confirmer le mot de passe</label>
      <input type="password" id="confirm_password" placeholder="Répétez le mot de passe" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn" id="btn-submit">Mettre à jour</button>
  </form>

  <div class="error" id="error-msg"></div>
  <div class="success" id="success-msg"></div>

  <div class="back"><a href="/login">← Retour à la connexion</a></div>
</div>

<script nonce="{{ csp_nonce }}">
"use strict";
const TOKEN = {{ token | tojson }};
const form = document.getElementById('reset-form');
const btn = document.getElementById('btn-submit');
const errorEl = document.getElementById('error-msg');
const successEl = document.getElementById('success-msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('new_password').value;
  const p2 = document.getElementById('confirm_password').value;
  errorEl.style.display = 'none'; successEl.style.display = 'none';

  if(p1.length < 8){ showError("Minimum 8 caractères."); return; }
  if(p1 !== p2){ showError("Les deux mots de passe ne correspondent pas."); return; }

  btn.disabled = true; btn.textContent = 'Mise à jour...';

  try {
    const r = await fetch('/api/reset-password/' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({new_password: p1})
    });
    const data = await r.json();
    if(data.ok){
      showSuccess(data.message || "Mot de passe réinitialisé !");
      form.style.display = 'none';
      setTimeout(() => { window.location.href = '/login'; }, 2500);
    } else {
      showError(data.error || "Erreur serveur.");
    }
  } catch(err) {
    showError("Erreur de connexion. Réessayez.");
  }
  btn.disabled = false; btn.textContent = 'Mettre à jour';
});

function showError(msg){ errorEl.textContent = '⚠ ' + msg; errorEl.style.display = 'block'; successEl.style.display = 'none'; }
function showSuccess(msg){ successEl.textContent = '✅ ' + msg; successEl.style.display = 'block'; errorEl.style.display = 'none'; }
</script>
</body>
</html>
